<style>
:root{--bg:#0B0906;--deep:#070503;--gold:#E5B444;--ice:#C2E4EE;--cream:#EEE8DC;--muted:#635850;--dim2:#2A2318;--black:#060402;--red:#E05A44;--green:#4AC98C;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font-family:var(--sans)}
textarea{resize:none;border:none;outline:none}
#app{position:absolute;inset:0;overflow:hidden}
.ball{border-radius:50%;flex-shrink:0;position:relative;background:radial-gradient(circle at 32% 28%,#FFF 0%,#EEF7FB 12%,#C0DDE9 36%,#82B0C2 60%,#527C8F 80%,#2F5E6E 100%)}
.ball::before{content:'';position:absolute;top:13%;left:15%;width:36%;height:26%;background:rgba(255,255,255,0.58);border-radius:50%;filter:blur(4px);transform:rotate(-22deg)}
.ball::after{content:'';position:absolute;bottom:18%;right:14%;width:22%;height:16%;background:rgba(194,228,238,0.28);border-radius:50%;filter:blur(5px)}
.logo{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--cream);letter-spacing:0.04em}
.logo .dot{color:var(--ice)}
.btn-gold{width:100%;padding:18px;border-radius:18px;background:var(--gold);color:var(--black);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 32px rgba(229,180,68,0.34)}
.btn-ghost{width:100%;padding:16px;border-radius:18px;background:rgba(255,255,255,0.03);border:1px solid var(--dim2);color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-dim{width:100%;padding:18px;border-radius:18px;background:var(--dim2);color:var(--muted);font-size:16px;font-weight:600}
@keyframes ballFloat{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}70%{transform:translateY(-5px)}}
@keyframes ballPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ballSpin{to{transform:rotate(360deg)}}
@keyframes haloPulse{0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:0.9;transform:scale(1.38)}}
@keyframes captionPop{0%{transform:scale(0.85);opacity:0}100%{transform:scale(1);opacity:1}} @keyframes snowFall{0%{transform:translateY(-10px);opacity:0}5%{opacity:1}95%{opacity:0.5}100%{transform:translateY(110vh);opacity:0}} @keyframes snowRise{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:0.7}100%{transform:translateY(-110vh);opacity:0}}
@keyframes waveBar{0%{transform:scaleY(0.08);opacity:0.2}100%{transform:scaleY(1);opacity:1}}
@keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.9}}
@keyframes orbitCW{to{transform:rotate(360deg)}}
@keyframes orbitCCW{to{transform:rotate(-360deg)}}
@keyframes dotRise{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-200px);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes throwFly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}100%{transform:translate(200px,-500px) scale(0.02) rotate(760deg);opacity:0}}
@keyframes trailGrow{from{transform:translateX(-50%) rotate(-38deg) scaleY(0);opacity:0}to{transform:translateX(-50%) rotate(-38deg) scaleY(1);opacity:0.35}}
@keyframes kenBurns1{0%{transform:scale(1.0) translate(0%,0%)}100%{transform:scale(1.14) translate(-2.5%,-2%)}}
@keyframes kenBurns2{0%{transform:scale(1.1) translate(-1.5%,1%)}100%{transform:scale(1.0) translate(0%,0%)}}
@keyframes kenBurns3{0%{transform:scale(1.0) translate(1%,-1%)}100%{transform:scale(1.12) translate(-1.5%,1.5%)}}
@keyframes kenBurns4{0%{transform:scale(1.12) translate(0%,1.5%)}100%{transform:scale(1.0) translate(-2%,0%)}}
@keyframes imgReveal{from{opacity:0}to{opacity:1}}
</style>

let _timers=[];

function ballShadow(s){return[`inset ${-s*.14}px ${-s*.12}px ${s*.30}px rgba(0,0,0,0.30)`,`inset ${s*.06}px ${s*.06}px ${s*.18}px rgba(255,255,255,0.70)`,`0 ${s*.14}px ${s*.46}px rgba(0,0,0,0.60)`,`0 0 ${s*.46}px rgba(194,228,238,0.20)`].join(',')}
function addSnow(el,count,dim){for(let i=0;i<count;i++){const p=document.createElement('div');const sz=2+(i%3);const op=(dim?0.07:0.22)+(i%4)*(dim?0.03:0.07);p.style.cssText=['position:absolute','top:-10px','border-radius:50%','pointer-events:none',`width:${sz}px`,`height:${sz}px`,`left:${((i*37+11)%93)+2}%`,`background:rgba(194,228,238,${op})`,`animation:snowFall ${9+(i%6)*1.9}s linear ${-((i*2.5)%16)}s infinite`].join(';');el.appendChild(p)}}
function makeBall(size,animStr,extraStyle){const d=document.createElement('div');d.className='ball';d.style.cssText=[`width:${size}px`,`height:${size}px`,`box-shadow:${ballShadow(size)}`,animStr?`animation:${animStr}`:'',extraStyle||''].filter(Boolean).join(';');return d}
async function callClaude(system,user){const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,system,messages:[{role:'user',content:user}]})});if(!r.ok)throw new Error('Story engine error '+r.status);const d=await r.json();return d.content?.[0]?.text??''}
async function generateImage(prompt,highQuality){var model=highQuality?'fal-ai/flux/dev':'fal-ai/flux/schnell';var fp=prompt+', ultra photorealistic, professional photography, perfect composition, no artifacts, no distorted faces, no text, no watermarks, cinema quality';var steps=highQuality?28:4;const r=await fetch('/api/image?model='+encodeURIComponent(model),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Key '+FAL_KEY},body:JSON.stringify({prompt:fp,image_size:'landscape_4_3',num_inference_steps:steps,num_images:1})});if(!r.ok)throw new Error('Image error '+r.status);const d=await r.json();const url=d.images?.[0]?.url;if(!url)throw new Error('No image returned');return url}
async function generateSpeech(text,voiceId){ const r=await fetch('/api/voice?voice='+(voiceId||'pNInz6obpgDQGcFmaJgB'),{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text,model_id:'eleven_monolingual_v1',voice_settings:{stability:0.5,similarity_boost:0.75}}) }); if(!r.ok)throw new Error('Voice error '+r.status); const blob=await r.blob(); return {url:URL.createObjectURL(blob),wordTimings:[]}; }

const SYS="You are a viral story editor trained on McKee, Harmon Story Circle, and TikTok scroll psychology. Given a raw personal story, return ONLY a valid JSON object no markdown no backticks. HOOK: Must stop a thumb mid-scroll in 3 seconds. Use one of: Confession, Contradiction, Stakes, Intrigue. Be specific to this story. Under 12 words. Present tense. IMAGE PROMPTS: Describe ONE specific cinematic moment. 35mm film, shallow depth of field, dramatic natural lighting, photorealistic, no text. Return this JSON: {\"genre\":\"REQUIRED one of: funny dramatic romantic action tragic triumphant\",\"hook\":\"scroll-stopping hook under 12 words\",\"location\":\"specific place and time under 8 words\",\"narration\":\"First-person 90-130 words. Opens with hook. Builds with But/Therefore. Cinematic and specific.\",\"hookImagePrompt\":\"Cinematic image matching hook emotion. 35mm film dramatic photorealistic no text.\",\"scenes\":[{\"beat\":\"opening\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"},{\"beat\":\"tension\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"},{\"beat\":\"escalation\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"},{\"beat\":\"conflict peak\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"},{\"beat\":\"turning point\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"},{\"beat\":\"resolution\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"},{\"beat\":\"aftermath\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"},{\"beat\":\"final image\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\"}],\"caption\":\"TikTok caption teases without spoiling + 4 hashtags under 160 chars.\",\"voiceId\":\"Choose best ElevenLabs voice ID. Options: pNInz6obpgDQGcFmaJgB Adam warm male, ErXwobaYiN019PkySvjV Antoni narrative male, TxGEqnHWrfWFTfGW9XjX Josh deep cinematic male, 21m00Tcm4TlvDq8ikWAM Rachel warm female, EXAVITQu4vr4xnSDxMaL Bella emotional female, MF3mGyEYCl7XYWbV9V6O Elli energetic female. Return only the ID.\"}";
async function shapeStory(raw,genreHint){if(genreHint){raw=raw+' [Shape this as a '+genreHint+' story using that genre structure]';}const text=await callClaude(SYS,raw);const clean=text.replace(/\x60\x60\x60json\s*/g,'').replace(/\x60\x60\x60\s*/g,'').trim();try{return JSON.parse(clean)}catch(ex){const m=clean.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw new Error('Could not shape story')}}
const PHOTO_SYS="You are a viral story editor and visual director. The user has shared real photos from their life. Analyze each photo for story relevance, visual quality, and emotional impact. Build the most compelling 4-image visual story using: KEEP high quality photos (type: user_photo), ENHANCE low quality photos as mood reference (type: ai_from_reference), FILL gaps with AI scenes (type: ai_generate). Return ONLY valid JSON no markdown: {\"hook\":\"scroll-stopping hook under 12 words\",\"location\":\"place and time under 8 words\",\"narration\":\"First-person 90-130 words opens with hook warm cinematic specific.\",\"hookImagePrompt\":\"35mm film dramatic photorealistic no text.\",\"caption\":\"TikTok caption teases + 4 hashtags under 160 chars.\",\"visualPlan\":[{\"type\":\"user_photo\",\"photoIndex\":0,\"reason\":\"why\"},{\"type\":\"ai_generate\",\"imagePrompt\":\"35mm film dramatic photorealistic no text.\",\"reason\":\"gap\"},{\"type\":\"ai_from_reference\",\"photoIndex\":1,\"imagePrompt\":\"35mm film photorealistic no text.\",\"reason\":\"why\"},{\"type\":\"user_photo\",\"photoIndex\":2,\"reason\":\"why\"}]}";

function resizeImageForAPI(dataUrl,maxSize){ return new Promise(function(resolve){ var img=new Image(); img.onload=function(){ var w=img.width,ht=img.height; var scale=Math.min(1,maxSize/Math.max(w,ht)); var canvas=document.createElement('canvas'); canvas.width=Math.round(w*scale); canvas.height=Math.round(ht*scale); var ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height); resolve(canvas.toDataURL('image/jpeg',0.7)); }; img.src=dataUrl; }); }

async function shapeStoryFromPhotos(photos,context){ var resized=[]; for(var i=0;i<photos.length;i++){resized.push(await resizeImageForAPI(photos[i],800));} const content=resized.map(d=>{const parts=d.split(',');const mt=parts[0].match(/:(.*?);/)[1];return{type:'image',source:{type:'base64',media_type:mt,data:parts[1]}};});content.push({type:'text',text:PHOTO_SYS+' Context: '+context});const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,messages:[{role:'user',content:content}]})});if(!r.ok)throw new Error('Vision error '+r.status);const d=await r.json();const txt=d.content&&d.content[0]?d.content[0].text:'';const clean=txt.replace(/```json/g,'').replace(/```/g,'').trim();try{return JSON.parse(clean);}catch(ex){const m=clean.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw new Error('Could not read photos.');}}


async function executeVisualPlan(plan,photos,setProgFn){ const images=[]; const vp=plan.visualPlan||[]; const total=vp.length||4; for(let i=0;i<vp.length;i++){ const step=vp[i]; if(step.type==='user_photo'&&photos[step.photoIndex]){ images.push(photos[step.photoIndex]); } else if(step.type==='ai_generate'||step.type==='ai_from_reference'){ const url=await generateImage(step.imagePrompt); images.push(url); } if(setProgFn)setProgFn(20+((i+1)/total)*55); } if(images.length===0)photos.forEach(p=>images.push(p)); const seen=new Set();const deduped=images.filter(img=>{if(seen.has(img))return false;seen.add(img);return true;}); return deduped.length>0?deduped:images; }
function renderPhotos(app){userPhotos=[];app.style.background='#070503';const wrap=document.createElement('div');wrap.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;';app.appendChild(wrap);const hdr=document.createElement('div');hdr.style.cssText='padding:52px 24px 0;display:flex;align-items:center;justify-content:space-between;';const backBtn=document.createElement('button');backBtn.style.cssText='color:var(--muted);font-family:var(--sans);font-size:13px;padding:4px 0;background:none;border:none;cursor:pointer;';backBtn.textContent='← Back';backBtn.onclick=()=>go('home');const logoDiv=document.createElement('div');logoDiv.className='logo';logoDiv.style.fontSize='19px';logoDiv.innerHTML='snow<span class="dot">●</span>ball';const spacer=document.createElement('div');spacer.style.width='50px';hdr.appendChild(backBtn);hdr.appendChild(logoDiv);hdr.appendChild(spacer);wrap.appendChild(hdr);const info=document.createElement('div');info.style.cssText='padding:14px 26px 0;';info.innerHTML='<div style="font-family:var(--serif);font-size:24px;font-style:italic;font-weight:300;color:var(--cream)">Your photos, your story</div><div style="font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5">Add up to 4 photos. AI reads them and writes your narration.</div>';wrap.appendChild(info);const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px;flex:1;';wrap.appendChild(grid);const photoData={};function makeSlot(i){const slot=document.createElement('div');slot.style.cssText='background:rgba(255,255,255,0.03);border:1.5px dashed var(--dim2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;overflow:hidden;min-height:110px;';const icon=document.createElement('div');icon.textContent='📷';icon.style.fontSize='24px';const lbl=document.createElement('div');lbl.textContent='Add photo';lbl.style.cssText='font-family:var(--sans);font-size:11px;color:var(--muted);';const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';slot.appendChild(icon);slot.appendChild(lbl);slot.appendChild(inp);slot.onclick=()=>inp.click();inp.onchange=()=>{const file=inp.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{photoData[i]=ev.target.result;slot.innerHTML='';const img=document.createElement('img');img.src=ev.target.result;img.style.cssText='width:100%;height:100%;object-fit:cover;position:absolute;inset:0;';const rm=document.createElement('div');rm.textContent='✕';rm.style.cssText='position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;font-size:12px;color:white;cursor:pointer;';rm.onclick=ev2=>{ev2.stopPropagation();delete photoData[i];grid.replaceChild(makeSlot(i),slot);updateBtn();};slot.appendChild(img);slot.appendChild(rm);slot.style.border='none';updateBtn();};reader.readAsDataURL(file);};return slot;}for(let i=0;i<4;i++)grid.appendChild(makeSlot(i));const ctx=document.createElement('textarea');ctx.placeholder='Optional: describe what happened...';ctx.style.cssText='height:66px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid var(--dim2);color:var(--cream);font-family:var(--serif);font-size:15px;font-style:italic;padding:12px 16px;caret-color:var(--gold);resize:none;outline:none;margin:0 20px;width:calc(100% - 40px);';wrap.appendChild(ctx);const foot=document.createElement('div');foot.style.cssText='padding:10px 20px 44px;';const btn=document.createElement('button');btn.className='btn-dim';btn.style.cssText='font-size:16px;font-weight:600;padding:18px;border-radius:18px;width:100%;';btn.textContent='Add at least 1 photo';foot.appendChild(btn);wrap.appendChild(foot);function updateBtn(){const c=Object.keys(photoData).length;if(c>0){btn.className='btn-gold';btn.textContent='Shape my story ❄ ('+c+' photo'+(c>1?'s':'')+')';}else{btn.className='btn-dim';btn.textContent='Add at least 1 photo';}}btn.onclick=()=>{const photos=Object.values(photoData);if(!photos.length)return;userPhotos=photos;rawStory=ctx.value||'Tell the story in these photos.';go('building');};}


function getHistory(){try{return JSON.parse(localStorage.getItem('sb_history')||'[]');}catch(e){return [];}}
function saveToHistory(s){var hist=getHistory();var e={id:Date.now(),date:new Date().toISOString(),hook:s.hook,location:s.location,caption:s.caption,images:s.images,audioUrl:s.audioUrl,shared:false};hist.unshift(e);if(hist.length>50)hist.pop();localStorage.setItem('sb_history',JSON.stringify(hist));return e;}
function getStreak(){var hist=getHistory();if(!hist.length)return 0;var days=new Set(hist.map(function(h){return h.date.slice(0,10);}));var streak=0;var d=new Date();for(var i=0;i<365;i++){var ds=d.toISOString().slice(0,10);if(days.has(ds)){streak++;d.setDate(d.getDate()-1);}else break;}return streak;}

reateElement('div');card.style.cssText='background:rgba(255,255,255,0.03);border:1px solid var(--dim2);border-radius:16px;overflow:hidden;display:flex;cursor:pointer;min-height:80px;';var thumb=document.createElement('div');thumb.style.cssText='width:80px;flex-shrink:0;background:#1a1410;position:relative;overflow:hidden;';if(entry.images&&entry.images[0]){var ti=document.createElement('img');ti.src=entry.images[0];ti.style.cssText='width:100%;height:100%;object-fit:cover;';thumb.appendChild(ti);}var info=document.createElement('div');info.style.cssText='flex:1;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden;';var hookEl=document.createElement('div');hookEl.style.cssText='font-family:var(--serif);font-size:15px;font-style:italic;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';hookEl.textContent=entry.hook||'Untitled';var metaEl=document.createElement('div');metaEl.style.cssText='font-family:var(--sans);font-size:10px;color:var(--muted);';var dd=new Date(entry.date);metaEl.textContent=dd.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(entry.shared?' · Shared':'');info.appendChild(hookEl);info.appendChild(metaEl);card.appendChild(thumb);card.appendChild(info);card.onclick=function(){story=entry;go('playback');};list.appendChild(card);});}}
