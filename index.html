<style>
:root{--bg:#0B0906;--deep:#070503;--gold:#E5B444;--ice:#C2E4EE;--cream:#EEE8DC;--muted:#635850;--dim2:#2A2318;--black:#060402;--red:#E05A44;--green:#4AC98C;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font-family:var(--sans)}
textarea{resize:none;border:none;outline:none}

.ball{border-radius:50%;flex-shrink:0;position:relative;background:radial-gradient(circle at 32% 28%,#FFF 0%,#EEF7FB 12%,#C0DDE9 36%,#82B0C2 60%,#527C8F 80%,#2F5E6E 100%)}

.logo{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--cream);letter-spacing:0.04em}
.logo .dot{color:var(--gold)}
.btn-gold{width:100%;padding:18px;border-radius:18px;background:var(--gold);color:var(--black);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 32px rgba(229,180,68,0.34)}
.btn-ghost{width:100%;padding:16px;border-radius:18px;background:rgba(255,255,255,0.03);border:1px solid var(--dim2);color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-dim{width:100%;padding:18px;border-radius:18px;background:var(--dim2);color:var(--muted);font-size:16px;font-weight:600}
@keyframes ballFloat{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}70%{transform:translateY(-5px)}}
@keyframes ballPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ballSpin{to{transform:rotate(360deg)}}
@keyframes haloPulse{0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:0.9;transform:scale(1.38)}}
@keyframes snowRise{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:0.7}100%{transform:translateY(-110vh);opacity:0}}
@keyframes waveBar{0%{transform:scaleY(0.08);opacity:0.2}100%{transform:scaleY(1);opacity:1}}
@keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.9}}
@keyframes orbitCW{to{transform:rotate(360deg)}}
@keyframes orbitCCW{to{transform:rotate(-360deg)}}
@keyframes dotRise{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-200px);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes throwFly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}100%{transform:translate(200px,-500px) scale(0.02) rotate(760deg);opacity:0}}
@keyframes trailGrow{from{transform:translateX(-50%) rotate(-38deg) scaleY(0);opacity:0}to{transform:translateX(-50%) rotate(-38deg) scaleY(1);opacity:0.35}}
@keyframes kenBurns1{0%{transform:scale(1.0) translate(0%,0%)}100%{transform:scale(1.14) translate(-2.5%,-2%)}}
@keyframes kenBurns2{0%{transform:scale(1.1) translate(-1.5%,1%)}100%{transform:scale(1.0) translate(0%,0%)}}
@keyframes kenBurns3{0%{transform:scale(1.0) translate(1%,-1%)}100%{transform:scale(1.12) translate(-1.5%,1.5%)}}
@keyframes kenBurns4{0%{transform:scale(1.12) translate(0%,1.5%)}100%{transform:scale(1.0) translate(-2%,0%)}}
@keyframes imgReveal{from{opacity:0}to{opacity:1}}
</style>

let _timers=[];

function ballShadow(s){return[`inset ${-s*.14}px ${-s*.12}px ${s*.30}px rgba(0,0,0,0.30)`,`inset ${s*.06}px ${s*.06}px ${s*.18}px rgba(255,255,255,0.70)`,`0 ${s*.14}px ${s*.46}px rgba(0,0,0,0.60)`,`0 0 ${s*.46}px rgba(194,228,238,0.20)`].join(',')}
function addSnow(el,count,dim){for(let i=0;i<count;i++){const p=document.createElement('div');const sz=2+(i%3);const op=(dim?0.07:0.22)+(i%4)*(dim?0.03:0.07);p.style.cssText=['position:absolute','bottom:0','border-radius:50%','pointer-events:none',`width:${sz}px`,`height:${sz}px`,`left:${((i*37+11)%93)+2}%`,`background:rgba(194,228,238,${op})`,`animation:snowRise ${9+(i%6)*1.9}s linear ${-((i*2.5)%16)}s infinite`].join(';');el.appendChild(p)}}
function makeBall(size,animStr,extraStyle){const d=document.createElement('div');d.className='ball';d.style.cssText=[`width:${size}px`,`height:${size}px`,`box-shadow:${ballShadow(size)}`,animStr?`animation:${animStr}`:'',extraStyle||''].filter(Boolean).join(';');return d}
async function callClaude(system,user){const r=await fetch('https:///api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,system,messages:[{role:'user',content:user}]})});if(!r.ok)throw new Error('Story engine error '+r.status);const d=await r.json();return d.content?.[0]?.text??''}
async function generateImage(prompt){const r=await fetch('https://fal.run/fal-ai/flux/schnell',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Key '+FAL_KEY},body:JSON.stringify({prompt,image_size:'landscape_4_3',num_inference_steps:4,num_images:1})});if(!r.ok)throw new Error('Image error '+r.status);const d=await r.json();const url=d.images?.[0]?.url;if(!url)throw new Error('No image returned');return url}
async function generateSpeech(text){const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+EL_VOICE,{method:'POST',headers:{'Content-Type':'application/json','xi-api-key':EL_KEY},body:JSON.stringify({text,model_id:'eleven_turbo_v2_5',voice_settings:{stability:0.45,similarity_boost:0.76,style:0.28,use_speaker_boost:true}})});if(!r.ok)throw new Error('Voice error '+r.status);return URL.createObjectURL(await r.blob())}
const SYS=`You are a cinematic story editor trained on McKee, Harmon Story Circle, and the But/Therefore rule. Given a raw personal story, return ONLY a valid JSON object — no markdown, no backticks. {"hook":"One sentence under 12 words. Present tense.","location":"Place · Time. Under 8 words.","narration":"First-person. 90-130 words. Starts with hook. Warm, cinematic.","scenes":[{"beat":"scene","imagePrompt":"Cinematic photography. Specific scene. 35mm grain. Dramatic light. No text."},{"beat":"scene","imagePrompt":"Cinematic photography. Specific scene. 35mm grain. Dramatic light. No text."},{"beat":"scene","imagePrompt":"Cinematic photography. Specific scene. 35mm grain. Dramatic light. No text."},{"beat":"scene","imagePrompt":"Cinematic photography. Specific scene. 35mm grain. Dramatic light. No text."}],"caption":"TikTok caption + 4 hashtags. Under 160 chars."}`;
async function shapeStory(raw){const text=await callClaude(SYS,raw);const clean=text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();try{return JSON.parse(clean)}catch{const m=clean.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw new Error('Could not parse story. Please try again.')}}
function render(){const app=document.getElementById('app');app.innerHTML='';({home:renderHome,type:renderType,speak:renderSpeak,building:renderBuilding,playback:renderPlayback,error:renderError}[screen]||renderHome)(app)}
function renderHome(app){app.style.background='#0B0906';addSnow(app,22,false);const glow=document.createElement('div');glow.style.cssText='position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(229,180,68,0.07) 0%,transparent 70%);pointer-events:none;';app.appendChild(glow);const wrap=document.createElement('div');wrap.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:1;';app.appendChild(wrap);const hdr=document.createElement('div');hdr.style.cssText='width:100%;padding:52px 24px 0;display:flex;align-items:center;justify-content:space-between;';hdr.innerHTML=`<div class="logo">snow<span class="dot">●</span>ball</div><div style="display:flex;align-items:center;gap:7px;background:rgba(229,180,68,0.15);border:1px solid rgba(229,180,68,0.24);border-radius:20px;padding:6px 13px;"><div class="ball" style="width:14px;height:14px;flex-shrink:0;box-shadow:${ballShadow(14)};"></div><span style="font-family:var(--sans);font-size:12px;font-weight:500;color:var(--gold);">3 day streak</span></div>`;wrap.appendChild(hdr);const pa=document.createElement('div');pa.style.cssText='flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 34px;text-align:center;margin-top:-40px;';pa.innerHTML=`<div style="font-family:var(--sans);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:20px;">your story is waiting</div><div id="prompt-text" style="font-family:var(--serif);font-size:28px;font-weight:300;font-style:italic;color:var(--cream);line-height:1.3;min-height:100px;display:flex;align-items:center;text-align:center;transition:opacity 0.5s ease;">"${PROMPTS[promptIdx]}"</div><div id="prompt-dots" style="display:flex;gap:5px;margin-top:20px;"></div>`;wrap.appendChild(pa);updateDots();const ballWrap=document.createElement('div');ballWrap.style.cssText='position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px;cursor:pointer;';const halo=document.createElement('div');halo.style.cssText='position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(194,228,238,0.11) 0%,transparent 70%);animation:haloPulse 3s ease-in-out infinite;pointer-events:none;';const ball=makeBall(112,'ballFloat 4.2s ease-in-out infinite');ballWrap.appendChild(halo);ballWrap.appendChild(ball);ballWrap.onclick=()=>go('speak');wrap.appendChild(ballWrap);const hint=document.createElement('div');hint.style.cssText='font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:0.08em;margin-bottom:18px;';hint.textContent='tap to start speaking';wrap.appendChild(hint);const btns=document.createElement('div');btns.style.cssText='width:100%;padding:0 20px 44px;display:flex;flex-direction:column;gap:10px;';const bs=document.createElement('button');bs.className='btn-gold';bs.innerHTML='🎙 &nbsp;Speak it';bs.onclick=()=>go('speak');const bt=document.createElement('button');bt.className='btn-ghost';bt.innerHTML='✏️ &nbsp;Type it';bt.onclick=()=>go('type');btns.appendChild(bs);btns.appendChild(bt);wrap.appendChild(btns);every(()=>{const el=document.getElementById('prompt-text');if(!el)return;el.style.opacity='0';later(()=>{promptIdx=(promptIdx+1)%PROMPTS.length;const el2=document.getElementById('prompt-text');if(el2){el2.textContent='"'+PROMPTS[promptIdx]+'"';el2.style.opacity='1'}updateDots()},540)},4600);function updateDots(){const d=document.getElementById('prompt-dots');if(!d)return;d.innerHTML=PROMPTS.map((_,i)=>`<div style="height:5px;border-radius:3px;transition:all 0.35s ease;width:${i===promptIdx?18:5}px;background:${i===promptIdx?'var(--gold)':'var(--dim2)'};"></div>`).join('')}}
function renderType(app){app.style.background='#070503';app.innerHTML=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;"><div style="padding:52px 24px 0;display:flex;align-items:center;justify-content:space-between;"><button id="back" style="color:var(--muted);font-family:var(--sans);font-size:13px;padding:4px 0;">← Back</button><div class="logo" style="font-size:19px;">snow<span class="dot">●</span>ball</div><div style="width:50px;"></div></div><div style="padding:22px 26px 0;"><div style="font-family:var(--serif);font-size:26px;font-style:italic;font-weight:300;color:var(--cream);line-height:1.25;">Tell me your story</div><div style="font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;">Don't edit yourself. Just write. The AI will shape it.</div></div><textarea id="story-ta" placeholder="I was somewhere I wasn't supposed to be..." style="flex:1;margin:16px 20px;border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid var(--dim2);color:var(--cream);font-family:var(--serif);font-size:17px;font-style:italic;font-weight:300;line-height:1.65;padding:18px 20px;caret-color:var(--gold);transition:border-color 0.3s;"></textarea><div style="padding:0 20px 44px;display:flex;flex-direction:column;gap:10px;"><div style="display:flex;justify-content:space-between;padding:0 2px;"><div id="ready-lbl" style="font-family:var(--sans);font-size:11px;color:var(--muted);">Keep writing...</div><div id="char-ct" style="font-family:var(--sans);font-size:11px;color:var(--muted);">0 chars</div></div><button id="shape-btn" class="btn-dim" style="font-size:16px;font-weight:600;padding:18px;border-radius:18px;width:100%;">Shape my story  ❄️</button></div></div>`;document.getElementById('back').onclick=()=>go('home');const ta=document.getElementById('story-ta');const btn=document.getElementById('shape-btn');const lbl=document.getElementById('ready-lbl');const ct=document.getElementById('char-ct');ta.oninput=()=>{const len=ta.value.trim().length;ct.textContent=ta.value.length+' chars';ta.style.borderColor=ta.value.length>0?'rgba(255,255,255,0.1)':'var(--dim2)';if(len>30){btn.className='btn-gold';lbl.style.color='var(--green)';lbl.textContent='✓ Ready to shape'}else{btn.className='btn-dim';lbl.style.color='var(--muted)';lbl.textContent='Keep writing...'}};btn.onclick=()=>{if(ta.value.trim().length>30){rawStory=ta.value;go('building')}};later(()=>ta.focus(),120)}
function renderSpeak(app){app.style.background='#070503';addSnow(app,10,true);const wrap=document.createElement('div');wrap.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:1;';wrap.innerHTML=`<div style="width:100%;padding:52px 24px 0;display:flex;align-items:center;justify-content:space-between;"><button id="back" style="color:var(--muted);font-family:var(--sans);font-size:13px;padding:4px 0;">← Back</button><div id="timer" style="font-family:var(--sans);font-size:14px;font-weight:300;color:var(--muted);letter-spacing:0.12em;font-variant-numeric:tabular-nums;">00:00</div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 24px;width:100%;"><div id="status" style="font-family:var(--serif);font-size:18px;font-weight:300;font-style:italic;color:rgba(238,232,220,0.28);letter-spacing:0.06em;animation:breathe 2.4s ease-in-out infinite;min-height:26px;text-align:center;">Tap the snowball to start</div><div id="wave" style="display:flex;align-items:center;gap:3px;"></div><div id="transcript" style="display:none;font-family:var(--serif);font-size:15px;font-style:italic;color:rgba(238,232,220,0.46);text-align:center;line-height:1.55;max-height:80px;overflow:hidden;width:100%;-webkit-mask-image:linear-gradient(to bottom,black 50%,transparent 100%);mask-image:linear-gradient(to bottom,black 50%,transparent 100%);"></div><div id="ball-zone" style="position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;"><div style="position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(194,228,238,0.10) 0%,transparent 70%);animation:haloPulse 2.2s ease-in-out infinite;pointer-events:none;"></div></div><div id="err-msg" style="display:none;font-family:var(--sans);font-size:12px;color:var(--red);text-align:center;padding:0 12px;line-height:1.5;"></div></div><div style="width:100%;padding:0 20px 44px;"><button id="done-btn" class="btn-dim" style="font-size:16px;font-weight:600;padding:18px;border-radius:18px;width:100%;">Keep talking...</button></div>`;app.appendChild(wrap);const waveEl=document.getElementById('wave');for(let i=0;i<28;i++){const mid=13.5,dist=Math.abs(i-mid)/mid;const h=Math.round(50-dist*22);const b=document.createElement('div');b.style.cssText=`width:3.5px;height:${h}px;border-radius:2px;background:var(--dim2);transform:scaleY(0.2);transform-origin:center;`;waveEl.appendChild(b)}const ballZone=document.getElementById('ball-zone');const spBall=makeBall(130,'ballFloat 4s ease-in-out infinite');ballZone.appendChild(spBall);document.getElementById('back').onclick=()=>go('home');let recog=null,listening=false,transcript='',secs=0;const timerEl=document.getElementById('timer');const statusEl=document.getElementById('status');const transEl=document.getElementById('transcript');const errEl=document.getElementById('err-msg');const doneBtn=document.getElementById('done-btn');every(()=>{secs++;timerEl.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},1000);function setWave(active){Array.from(waveEl.children).forEach((b,i)=>{const mid=13.5,dist=Math.abs(i-mid)/mid;const dur=(0.22+dist*0.26+(i%4)*0.06).toFixed(2);const del=((i*0.04)%0.42).toFixed(2);b.style.background=active?'var(--gold)':'var(--dim2)';b.style.transform=active?'':'scaleY(0.2)';b.style.animation=active?`waveBar ${dur}s ease-in-out ${del}s infinite alternate`:'none'})}function startRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){errEl.style.display='block';errEl.textContent='Speech needs Chrome/Safari. Use Type it.';return}if(recog){try{recog.abort()}catch(_){}}recog=new SR();recog.continuous=true;recog.interimResults=true;recog.lang='en-US';recog.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';transcript=s.trim();transEl.textContent=transcript;transEl.style.display=transcript?'block':'none';const rdy=transcript.length>20;doneBtn.className=rdy?'btn-gold':'btn-dim';doneBtn.textContent=rdy?'Shape my story  ❄️':'Keep talking...'};recog.onerror=e=>{if(e.error!=='aborted'){errEl.style.display='block';errEl.textContent='Mic: '+e.error}};recog.onstart=()=>{listening=true;setWave(true);statusEl.textContent='Rolling...';statusEl.style.color='rgba(238,232,220,0.72)';timerEl.style.color='var(--gold)';spBall.style.animation='ballPulse 1.8s ease-in-out infinite'};recog.onend=()=>{listening=false;setWave(false);statusEl.textContent='Tap to continue';statusEl.style.color='rgba(238,232,220,0.28)';timerEl.style.color='var(--muted)';spBall.style.animation='ballFloat 4s ease-in-out infinite'};recog.start()}ballZone.onclick=()=>{if(!listening)startRec()};doneBtn.onclick=()=>{if(transcript.length>20){if(recog){try{recog.stop()}catch(_){}}rawStory=transcript;go('building')}};later(startRec,300)}
function renderBuilding(app){app.style.background='#070503';app.innerHTML=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;"><div style="position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center;"><div style="position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(194,228,238,0.16);animation:orbitCW 3.4s linear infinite;"><div style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--ice);box-shadow:0 0 14px var(--ice);"></div></div><div style="position:absolute;inset:-22px;border-radius:50%;border:1px solid rgba(229,180,68,0.10);animation:orbitCCW 5.2s linear infinite;"><div style="position:absolute;bottom:-4px;left:42%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);"></div></div><div id="build-ball" class="ball" style="width:158px;height:158px;animation:ballSpin 10s linear infinite;z-index:2;box-shadow:inset -22px -18px 40px rgba(0,0,0,0.30),inset 10px 10px 26px rgba(255,255,255,0.68),0 22px 68px rgba(0,0,0,0.60),0 0 90px rgba(194,228,238,0.22);"></div></div><div id="preview-card" style="display:none;width:75%;max-width:260px;height:110px;border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.07);position:relative;margin-top:-20px;"><img id="preview-img" src="" alt="" style="width:100%;height:100%;object-fit:cover;"><div style="position:absolute;inset:0;background:rgba(0,0,0,0.3);"></div><div style="position:absolute;bottom:8px;left:10px;font-family:var(--sans);font-size:9px;color:rgba(255,255,255,0.6);letter-spacing:0.12em;text-transform:uppercase;">Scene 1 ready</div></div><div style="text-align:center;width:100%;padding:0 40px;"><div id="build-line" style="font-family:var(--serif);font-size:22px;font-weight:300;font-style:italic;color:var(--cream);m
