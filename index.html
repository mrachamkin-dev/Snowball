function ballShadow(s){return[`inset ${-s*.14}px ${-s*.12}px ${s*.30}px rgba(0,0,0,0.30)`,`inset ${s*.06}px ${s*.06}px ${s*.18}px rgba(255,255,255,0.70)`,`0 ${s*.14}px ${s*.46}px rgba(0,0,0,0.60)`,`0 0 ${s*.46}px rgba(194,228,238,0.20)`].join(',')}
function addSnow(el,count,dim){for(let i=0;i<count;i++){const p=document.createElement('div');const sz=2+(i%3);const op=(dim?0.07:0.22)+(i%4)*(dim?0.03:0.07);p.style.cssText=['position:absolute','top:-10px','border-radius:50%','pointer-events:none',`width:${sz}px`,`height:${sz}px`,`left:${((i*37+11)%93)+2}%`,`background:rgba(194,228,238,${op})`,`animation:snowFall ${9+(i%6)*1.9}s linear ${-((i*2.5)%16)}s infinite`].join(';');el.appendChild(p)}}
function makeBall(size,animStr,extraStyle){const d=document.createElement('div');d.className='ball';d.style.cssText=[`width:${size}px`,`height:${size}px`,`box-shadow:${ballShadow(size)}`,animStr?`animation:${animStr}`:'',extraStyle||''].filter(Boolean).join(';');return d}
async function callClaude(system,user){const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,system,messages:[{role:'user',content:user}]})});if(!r.ok)throw new Error('Story engine error '+r.status);const d=await r.json();return d.content?.[0]?.text??''}
function getVisualStyle(genre,extractedStyle){if(extractedStyle)return 'cinematic graphic novel illustration, painterly expressive brushwork, editorial art direction, emotionally charged color palette, complements real photography without competing, no text. Mood: '+extractedStyle;var styles={funny:'vibrant oversaturated colors, chaotic energy, flash photography, slightly blurry motion, disposable camera aesthetic, grain, real candid moment, no text',dramatic:'dark cinematic noir, extreme chiaroscuro lighting, deep black shadows, silver and shadow, desaturated, IMAX film grain, anamorphic lens flare, no text',romantic:'super 8 film, warm amber and rose tones, light leaks, soft grain, dreamy bokeh, golden hour haze, intimate and tender, no text',action:'high speed photography, motion blur, harsh strobe flash, gritty handheld documentary, high contrast black and white with one color, raw and kinetic, no text',tragic:'cold blue desaturated tones, overcast flat light, faded and washed out, melancholic still life, muted gray palette, heavy grain, no text',triumphant:'epic golden hour, wide angle lens, dramatic god rays, saturated warm light, heroic composition, cinematic scope, no text',awkward:'handheld camera feel, warm indoor lighting, slightly overexposed flash, candid and unposed, the aesthetic of a moment that should not have been documented'};return styles[genre]||'cinematic photography, dramatic natural lighting, 35mm film, no text';}

async function generateImage(prompt,highQuality,visualStyle){var model='fal-ai/flux/dev';var styleStr=visualStyle||'ultra photorealistic, professional photography, perfect composition, cinema quality';var fp='VISUAL STYLE (non-negotiable): '+styleStr+'. SCENE: '+prompt+'. No artifacts, no distorted faces, no watermarks';var steps=highQuality?28:12;const r=await fetch('/api/image?model='+encodeURIComponent(model),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Key '+FAL_KEY},body:JSON.stringify({prompt:fp,image_size:'landscape_4_3',num_inference_steps:steps,num_images:1})});if(!r.ok)throw new Error('Image error '+r.status);const d=await r.json();const url=d.images?.[0]?.url;if(!url)throw new Error('No image returned');return url}

}
var MUSIC_PROMPTS={funny:['upbeat quirky comedy underscore, playful pizzicato strings, bouncy rhythm, no vocals, instrumental','funky upbeat underscore, slap bass groove, clav hits, retro 70s comedy vibe, no vocals, instrumental','playful marimba and xylophone underscore, lighthearted cartoon energy, tongue-in-cheek, no vocals, instrumental'],dramatic:['cinematic dramatic underscore, deep orchestral tension, minor key strings, no vocals, instrumental','dark ambient underscore, low cello drone, sparse reverb piano, building unease, no vocals, instrumental','intense orchestral underscore, timpani swells, tremolo strings, slow build to climax, no vocals, instrumental'],romantic:['warm romantic underscore, soft piano and strings, golden hour feeling, no vocals, instrumental','intimate acoustic guitar underscore, fingerpicked arpeggios, warm and tender, no vocals, instrumental','dreamy lo-fi underscore, warm vinyl crackle, soft rhodes piano, gentle brush drums, no vocals, instrumental'],action:['high energy action underscore, driving percussion, urgent brass, no vocals, instrumental','electronic pulse underscore, synth arpeggios, pounding kick drum, cyberpunk tension, no vocals, instrumental','fast-paced orchestral chase underscore, staccato strings, snare rolls, relentless momentum, no vocals, instrumental'],tragic:['melancholic underscore, sparse piano, minor key, sorrowful, no vocals, instrumental','lonely cello solo underscore, slow vibrato, aching melody, cathedral reverb, no vocals, instrumental','ambient grief underscore, ethereal pads, distant piano notes, rain-like texture, hollow and aching, no vocals, instrumental'],triumphant:['epic triumphant underscore, swelling strings, building to resolution, no vocals, instrumental','anthemic orchestral underscore, french horns, soaring melody, victorious crescendo, no vocals, instrumental','uplifting post-rock underscore, delayed guitars building to wall of sound, hopeful and earned, no vocals, instrumental'],awkward:['quirky indie underscore, awkward pauses, plucky ukulele and glockenspiel, sheepish and endearing, no vocals, instrumental','lo-fi bedroom pop underscore, detuned synth, clumsy charm, slightly off-beat percussion, no vocals, instrumental','awkward comedy underscore, clarinet and pizzicato strings, nervous energy, sitcom cringe moment, no vocals, instrumental']};
var MUSIC_DURATIONS={4:22000,5:28000,6:34000,7:42000};
async function generateMusic(genre,segmentCount){try{var prompts=MUSIC_PROMPTS[genre]||MUSIC_PROMPTS.dramatic;var prompt=Array.isArray(prompts)?prompts[Math.floor(Math.random()*prompts.length)]:prompts;var dur=MUSIC_DURATIONS[segmentCount]||30000;var r=await fetch('/api/music',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,duration_ms:dur})});if(!r.ok)return null;var blob=await r.blob();return URL.createObjectURL(blob);}catch(e){return null;}}

function buildSYS(segmentCount,wordsPerSegment){
var s=segmentCount;
var arcMap={};
if(s<=4){
arcMap[1]='OPEN WITH GOLD: Start at the most surprising specific detail — not the beginning. Save the cat. Plant the loop.';
arcMap[2]='RAISE STAKES: What made this impossible to ignore? Their exact words. One detail so specific it could only be true.';
arcMap[3]='THE TURN: Value flips. Peak moment. Show it, do not explain it. Build tension then leave it unresolved for one beat.';
arcMap[4]='LAND IT: Close the loop. LANDING RULES: final sentence must be 8 words or fewer, declarative not questioning, reveals not explains, contrasts or resolves what came before, feels like a line someone would quote or say to a friend immediately. Second-to-last sentence builds tension toward it. The final sentence is the only thing they remember.';
}else if(s===5){
arcMap[1]='OPEN WITH GOLD: Most surprising specific detail first. Save the cat. Plant the loop.';
arcMap[2]='INCITING INCIDENT: What broke the normal? Their exact words. One detail nobody would make up.';
arcMap[3]='THE TURN: Value flips. The moment that changed everything. Show it.';
arcMap[4]='ALL IS LOST: Real cost. Something ends. Weight without commentary. Second-to-last sentence builds toward the landing.';
arcMap[5]='LAND IT: Close the loop. LANDING RULES: 8 words or fewer, declarative, reveals not explains, quotable. Must feel inevitable.';
}else if(s===6){
arcMap[1]='OPEN WITH GOLD: Most surprising detail first. Save the cat. Plant the loop.';
arcMap[2]='INCITING INCIDENT: What broke the normal? Their exact words. First micro-reward.';
arcMap[3]='BUILD: Genre delivers. Something almost works. Second micro-reward.';
arcMap[4]='THE TURN: Gap blows open. Value flips. Nobody saw it coming.';
arcMap[5]='ALL IS LOST: Cost is real. Something dies. Build tension in final line of this segment toward the landing.';
arcMap[6]='LAND IT: Close the loop. LANDING RULES: 8 words or fewer, declarative, reveals not explains, quotable, inevitable.';
}else{
arcMap[1]='OPEN WITH GOLD: Start at the most surprising specific detail in the entire story — not the beginning. The moment that makes someone say "wait, what?" Save the cat in the same breath. Plant the loop.';
arcMap[2]='INCITING INCIDENT: What shattered the normal? Their exact words and cadence — do not sanitize. First micro-reward: one detail so specific it could only be true.';
arcMap[3]='BUILD: Genre delivers its promise. Funny gets funnier. Tension tightens. Second micro-reward — false hope or a detail that makes it worse.';
arcMap[4]='THE TURN: Gap blows wide open. Value flips completely. Do not telegraph it. Show the exact sensory detail of the moment everything changed.';
arcMap[5]='ALL IS LOST: Real cost. Something dies — a belief, a relationship, a version of self. No commentary. Just the weight.';
arcMap[6]='DARK NIGHT: Sit in the loss. Then the realization. Build tension in the final line of this segment — it feeds directly into the landing.';
arcMap[7]='LAND IT: Close the loop from segment 1. LANDING RULES — follow these exactly: (1) Final sentence is 8 words or fewer. (2) Declarative not questioning. (3) Reveals do not explain. (4) Contrasts or resolves what came before. (5) Feels like a line someone would quote or immediately send to a friend. (6) Must feel inevitable — of course that is how it ends. RHYTHM: The second-to-last sentence in segment 6 builds tension. Then silence. Then this lands.';
}
var arcStr='';
for(var i=1;i<=s;i++){arcStr+='S'+i+': '+(arcMap[i]||'build tension, micro-reward.')+' | ';}
var totalWords=s*parseInt(wordsPerSegment);
var genreEndings='GENRE VOICE GUIDE — match the genre exactly. Do not average it. Do not play it safe. Commit fully. FUNNY: Write like a standup special, not a sitcom. Plant a false premise early. The punchline is the truth arriving sideways. Use the rule of three. Build callbacks — return to the detail from segment 1 with a twist. The final line should make someone immediately screenshot and send it. Timing lives in sentence length: build long, then short, then shorter, then the hit. ROMANTIC: Write like Nicholas Sparks at his best. Yearning, not stating. Every line has an unspoken question underneath it. Restrain the emotion until it has nowhere left to go, then let one small action carry all of it. Never explain the feeling — show the gesture, the pause, the thing they could not say. The reader should ache before the final line arrives. ACTION: Write like Hitchcock directed it. Show the bomb under the table, not the explosion. Build dread before danger. The threat should be present before the protagonist knows it. Short declarative sentences as the climax approaches. Incomplete thoughts. The reader holds their breath before anything even happens. DRAMATIC: Weight without melodrama. Specific over general. The one detail that makes it undeniably real. Silence after the turn — let it breathe. No explanation after the landing. Trust the reader. TRAGIC: One specific image holds all the weight. Never explain the loss — show the object, the habit, the thing that carries it. Beauty in restraint. The reader should feel it before they understand why. TRIUMPHANT: Earn it through the cost. The shaking hands, not the crowd. What it took from them is more powerful than what they won. Specificity of sacrifice is everything. AWKWARD: Write like someone recounting this to their best friend at 11pm. Slightly mortified, slightly delighted. The setup makes it seem survivable. The turn is the exact moment they realized how bad it looked. Never explain the embarrassment — show the specific detail that made it undeniable. The landing is self-aware but not self-pitying. Final line should make the reader wince and laugh at the same time. Rule: if it could happen to anyone, it will be forwarded to everyone. GENRE LANDING TEMPLATES — model the rhythm and weight: FUNNY: "Yeah. That did not go how I planned." / "Turns out I was the problem the whole time." / "I should have just stayed home." — reversal + self-awareness, punchy, instantly sendable. ROMANTIC: "She stayed." / "That was when I knew." / "Neither of us let go." — action not feeling, answers the unspoken question. ACTION: "It was already over." / "He made his choice." / "There was nowhere left to run." — consequence not triumph. DRAMATIC: "I never saw him again." / "That was the last time." — simple declarative, no explanation. TRAGIC: "The table was still set for two." / "I kept the voicemail." — one image, all the weight. TRIUMPHANT: "My hands would not stop shaking for a week." — cost not celebration. AWKWARD: "I still think about it." / "Nobody saw it. Except everyone." / "I have not been back since." — wince + laugh, specific, self-aware without being self-pitying.';
return 'You are the best story editor alive. STRICT RULE: NEVER invent specific details the user did not provide. WHIMSY RULE: If the story contains magical creatures, fantasy elements, talking animals, folklore, fairy tale logic, or absurdist premises — classify as funny and play it straight with a wink. Never import gravitas or metaphor into a story that is inherently silly. A leprechaun chasing a rainbow is funny. It is not a metaphor for anything. Honor the bit. If they said a place do not call it a hostel, bar, apartment, or anything specific they did not say. If they said a friend do not give that friend a name or backstory. Only use what the user explicitly gave you. Invented details break the authenticity of the story and destroy trust. HOOK RULE: The hook must tease, not reveal. It should make a stranger desperately need to know what happened next — not summarize what happened. A hook that gives away the punchline kills the story before it starts. The best hooks withhold the key detail while opening the loop. We got kicked out at 2am. Neither of us saw it coming. not We got kicked out for making sandwiches. MINE FOR GOLD FIRST: (1) Find the most surprising specific detail — the thing nobody would believe, the number, name, object, or moment that makes this real. (2) Preserve their exact voice and cadence — do not sanitize. Weird phrasing is authenticity. (3) Identify the turn — the single moment everything changed. (4) KNOW THE FINAL LINE BEFORE YOU WRITE WORD ONE. Work backward from it. BUILD AROUND THE GOLD. McKee: gap between expectation and result drives every beat. Harmon: comfort-need-go-search-find-take-return-change. STC: save the cat, all is lost, earn the landing. WHAT MAKES IT UNDENIABLE: Specificity — "2008 Honda Civic with broken AC" beats "my car". Sensory over explanatory. Voice over polish. Start at the most interesting moment not the beginning. WHAT KILLS IT: Generic emotions instead of specific moments. Explaining the feeling. Starting at the beginning. Cleaning up the voice. Endings that go on too long after the turn. '+genreEndings+' ARC ('+s+' segs, '+wordsPerSegment+' words each, ~'+totalWords+' total): '+arcStr+'HOOK COMPETITION: Generate 3 possible hooks. Each must open a different loop, use a different angle, feel like a different first line of a different movie. Then apply THE STRANGER TEST to each: read the hook as someone who knows nothing about the creator, their life, or the context. If it requires context to be interesting, it fails. A stranger must read it and physically need to know what happened next. Specificity creates universality — "I was in a Wendy\'s at 2am when my ex walked in with my boss" works. "Something weird happened that night" does not. Pick the hook that passes the stranger test most decisively. Put the winner in the hook field. Put all three in hookOptions array. IMAGE PROMPTS: Each imagePrompt must be cinematically specific. Include: shot type (close, wide, over-shoulder), specific lighting, time of day, one key prop, emotional texture. The visual style string will be prepended — do not repeat it. Write each prompt as if briefing a director of photography. PEOPLE RULE: Minimize people in images. Prefer environments, objects, hands, silhouettes, backs of heads, empty rooms, telling details. When a person must appear, infer gender from the narrator pronouns or name — if uncertain, use silhouette or obscure the face. Never invent a face. CRITICAL: Each imagePrompt illustrates THOSE EXACT WORDS. Return ONLY valid JSON: {genre, hook, hookOptions, location, hookImagePrompt, segments:[{text,imagePrompt}], caption, voiceId}. voiceId: pNInz6obpgDQGcFmaJgB Adam, ErXwobaYiN019PkySvjV Antoni, TxGEqnHWrfWFTfGW9XjX Josh, 21m00Tcm4TlvDq8ikWAM Rachel, EXAVITQu4vr4xnSDxMaL Bella, MF3mGyEYCl7XYWbV9V6O Elli. Return ID only.';}


function calcStoryDepth(photoCount,wordCount,audioDuration,imageCount){
if(imageCount&&imageCount>0){
var sc=Math.min(Math.max(imageCount,2),9);
var wps=sc<=3?'8-11':sc<=5?'10-13':sc<=7?'12-15':'13-17';
return {segmentCount:sc,wordsPerSegment:wps};
}
var wordScore=wordCount>200?6:wordCount>100?5:wordCount>60?4:wordCount>30?3:wordCount>15?2:1;
var audioScore=audioDuration>120?6:audioDuration>60?5:audioDuration>30?4:audioDuration>20?3:audioDuration>10?2:1;
var photoScore=photoCount>3?5:photoCount>2?4:photoCount>1?3:photoCount>0?2:0;
var depth=Math.max(wordScore,audioScore,photoScore);
if(depth<=1)return {segmentCount:2,wordsPerSegment:'7-10'};
if(depth===2)return {segmentCount:3,wordsPerSegment:'8-11'};
if(depth===3)return {segmentCount:4,wordsPerSegment:'10-13'};
if(depth===4)return {segmentCount:5,wordsPerSegment:'11-14'};
if(depth===5)return {segmentCount:6,wordsPerSegment:'12-15'};
return {segmentCount:7,wordsPerSegment:'13-17'};
}

async function shapeStory(raw,genreHint,depth){if(genreHint){raw=raw+' [Shape this as a '+genreHint+' story using that genre structure]';}var d=depth||calcStoryDepth(0,(raw||"").split(/\s+/).length,0);var SYS=buildSYS(d.segmentCount,d.wordsPerSegment);const text=await callClaude(SYS,raw);const clean=text.replace(/\x60\x60\x60json\s*/g,'').replace(/\x60\x60\x60\s*/g,'').trim();var parsed;try{parsed=JSON.parse(clean);}catch(ex){const m=clean.match(/\{[\s\S]*\}/);if(m)parsed=JSON.parse(m[0]);else throw new Error('Could not shape story');}if(parsed.segments&&parsed.segments.length){var segs=parsed.segments;var narParts=segs.map(function(s,i){var t=s.text||'';return (i===segs.length-1&&t)?'<break time="400ms"/>'+t:t;});parsed.narration=narParts.join(' ').trim();parsed.scenes=segs.map(function(s){return {beat:'scene',imagePrompt:s.imagePrompt||''};});}parsed._segments=parsed.segments||[];if(parsed.hookOptions&&parsed.hookOptions.length){window._lastHookOptions=parsed.hookOptions;}return parsed;}
const PHOTO_SYS="You are a viral story editor and visual director. The user has shared real photos. MINE FOR GOLD FIRST: do not describe what you see generically. Find the most surprising specific detail — the expression, the object, the moment, the thing nobody would make up. That is your hook. STRANGER TEST: the hook must make a complete stranger with zero context desperate to know what happened. Generic hooks like 'Three friends on vacation' fail. Specific hooks like 'She did not know I was about to propose' pass. Extract: (1) VISUAL STYLE: lighting, color tone, grain, mood — be specific. (2) CHARACTER: precise physical description of any person — hair, clothing, expression. Use these in every ai_generate prompt. NARRATION: mine the specific moment. What is actually happening? What is the tension? What is unsaid? Write like a filmmaker describing a real scene, not a caption writer describing a photo. Length: 1-2 photos=50-70 words, 3-4 photos=80-110 words. VISUAL PLAN RULES: You MUST include ai_generate images to expand the story beyond what the photos show. Minimum ai_generate counts: 1 photo=3 ai_generate, 2 photos=2 ai_generate, 3 photos=2 ai_generate, 4 photos=2 ai_generate. More context words from user = more ai_generate images. AI images should show: moments before, moments after, emotional close-ups, details the photos do not capture. Each ai_generate imagePrompt must be cinematically specific — shot type, lighting, time of day, key prop, emotional texture. The visualStyle string leads every prompt. PERSPECTIVE RULE: AI-generated images show the world from the narrator's point of view — what they saw, the environment around them, the other side of the moment. PEOPLE RULE: If the user photos contain identifiable people, do NOT recreate or approximate those people in AI images. Instead show: the places they were, objects they touched, views they saw, environments they stood in — everything that reinforces the story without recreating the subjects. If photos contain NO people, you may include human silhouettes or distant figures in AI images to add scale and life. NEVER generate a close face or recognizable likeness from a photo. TONE RULE: Read the emotional temperature of the photos and match it exactly. People smiling, laughing, in awe, adventuring = write with energy, joy, celebration. People crying, grieving, looking lost = follow that thread with weight and restraint. DEFAULT TO JOY. If the tone is ambiguous, choose celebration over melancholy every time. Never add aging, decline, slowing down, bittersweet reflection, or emotional weight that is not explicitly visible in the photos. Do not editorialize. Do not project. Do not therapize. PEOPLE RULE: Never generate AI versions of real people shown in the photos. Zero. The photos ARE the people. AI images show only environments, landscapes, objects, details, the world around them — never their faces or bodies recreated. PERSPECTIVE RULE: Tell the story from inside the experience, not looking back on it. Present tense energy. First person momentum. The viewer is living it, not remembering it. INVENTION RULE: Never invent any biographical detail. No ages, no health conditions, no relationship backstory, no personality traits, no occupations. Only what is literally visible in the photos. If you cannot see it, you cannot say it. Return ONLY valid JSON: {hook, location, narration, visualStyle (2 sentences), characterDescription (1 sentence), hookImagePrompt, caption (TikTok tease + 4 hashtags under 160 chars), visualPlan: array of {type: user_photo|ai_generate|ai_from_reference, photoIndex (for user_photo/ai_from_reference), imagePrompt (for ai_generate, cinematically specific), reason}}";

function resizeImageForAPI(dataUrl,maxSize,quality){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      var w=img.width,ht=img.height;
      var scale=Math.min(1,maxSize/Math.max(w,ht));
      var canvas=document.createElement('canvas');
      canvas.width=Math.round(w*scale);
      canvas.height=Math.round(ht*scale);
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',quality||0.7));
    };
    img.src=dataUrl;
  });
}

async function uploadUserPhotos(photos){
  var uploaded=[];
  for(var i=0;i<photos.length;i++){
    var p=photos[i];
    if(!p){uploaded.push(null);continue;}
    if(typeof p==='string'&&p.startsWith('http')){uploaded.push(p);continue;}
    try{
      var ct=p.match(/^data:([^;]+);/)?p.match(/^data:([^;]+);/)[1]:'image/jpeg';
      var r=await fetch('/api/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:p,contentType:ct})});
      var d=await r.json();
      uploaded.push(d.url||null);
    }catch(e){uploaded.push(null);}
  }
  return uploaded.filter(Boolean);
