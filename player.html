function initSnow(){

function initBlobs(){

    var ang=Math.random()*Math.PI*2,spd=2.5+Math.random()*13,sz=5+Math.random()*38;

function blobPath(bx,by,r,lumps,rot){
  var n=lumps.length;ctx.beginPath();

    var a=(i/n)*Math.PI*2+rot,lr=r*(0.65+lumps[i]*0.65);
    var x0=bx+Math.cos(a)*lr,y0=by+Math.sin(a)*lr;

    ctx.quadraticCurveTo(bx+Math.cos(amid)*rmid,by+Math.sin(amid)*rmid,x1,y1);

}

function drawBall(x,y,r,a){

  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();

    } else if(el<TOTAL){
      var dripT=(el-APPROACH-OVERLAP-SPLAT)/DRIP;
      for(var i=0;i<blobs.length;i++){
        var b=blobs[i];
        var lt=Math.max(0,(dripT-b.dripDelay*0.5)/(1-b.dripDelay*0.3));
        if(lt<=0){drawBlob(b);continue;}
        if(b.wet){b.y+=0.28+lt*2.6;b.r=Math.max(0.2,b.baseR*(1-lt*0.01));b.op=Math.max(0,1-eIn(lt)*1.12);}
