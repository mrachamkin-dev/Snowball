<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snowball</title>
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0906;--gold:#E5B444;--ice:#C2E4EE;--cream:#EEE8DC;--muted:#635850;--dim2:#2A2318;--black:#060402;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font-family:var(--sans)}
#app{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ball{border-radius:50%;flex-shrink:0;position:relative;background:radial-gradient(circle at 32% 28%,#FFF 0%,#EEF7FB 12%,#C0DDE9 36%,#82B0C2 60%,#527C8F 80%,#2F5E6E 100%)}
.ball::before{content:"";position:absolute;top:13%;left:15%;width:36%;height:26%;background:rgba(255,255,255,0.58);border-radius:50%;filter:blur(4px);transform:rotate(-22deg)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes ballFloat{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes kenBurns1{0%{transform:scale(1.0) translate(0%,0%)}100%{transform:scale(1.14) translate(-2.5%,-2%)}}
@keyframes kenBurns2{0%{transform:scale(1.1) translate(-1.5%,1%)}100%{transform:scale(1.0) translate(0%,0%)}}
@keyframes kenBurns3{0%{transform:scale(1.0) translate(1%,-1%)}100%{transform:scale(1.12) translate(-1.5%,1.5%)}}
@keyframes kenBurns4{0%{transform:scale(1.12) translate(0%,1.5%)}100%{transform:scale(1.0) translate(-2%,0%)}}
@keyframes captionPop{0%{transform:scale(0.85);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KB=["kenBurns1","kenBurns2","kenBurns3","kenBurns4"];
function trackEvent(name,data){try{fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({event:name},data||{}))}).catch(function(){});}catch(e){}}
function ballShadow(s){return["inset "+(-s*.14)+"px "+(-s*.12)+"px "+(s*.30)+"px rgba(0,0,0,0.30)","inset "+(s*.06)+"px "+(s*.06)+"px "+(s*.18)+"px rgba(255,255,255,0.70)","0 "+(s*.14)+"px "+(s*.46)+"px rgba(0,0,0,0.60)","0 0 "+(s*.46)+"px rgba(194,228,238,0.20)"].join(",");}
function getStoryId(){var p=window.location.pathname;var m=p.match(/\/s\/([a-z0-9]+)/i);return m?m[1]:null;}
async function loadStory(id){var r=await fetch("/api/story?id="+id);if(!r.ok)throw new Error("Story not found");return r.json();}
function renderLoading(){var app=document.getElementById("app");app.innerHTML="";app.style.background="#0B0906";var wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:20px;animation:fadeIn 0.6s ease;";var ball=document.createElement("div");ball.className="ball";ball.style.cssText="width:80px;height:80px;animation:ballFloat 3s ease-in-out infinite;box-shadow:"+ballShadow(80)+";";var txt=document.createElement("div");txt.style.cssText="font-family:var(--serif);font-size:18px;font-style:italic;color:var(--cream);opacity:0.6;";txt.textContent="Loading your story...";wrap.appendChild(ball);wrap.appendChild(txt);app.appendChild(wrap);}
function renderError(){var app=document.getElementById("app");app.innerHTML="";app.style.background="#0B0906";var wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:20px;padding:32px;text-align:center;animation:fadeIn 0.6s ease;";wrap.innerHTML="<div style=\"font-size:48px\">❄️</div><div style=\"font-family:var(--serif);font-size:24px;font-weight:300;font-style:italic;color:var(--cream)\">This snowball melted</div><div style=\"font-family:var(--sans);font-size:13px;color:var(--muted);line-height:1.6\">This story link has expired or doesn't exist.</div><a href=\"https://snowball-ten.vercel.app\" style=\"margin-top:12px;padding:14px 28px;border-radius:18px;background:var(--gold);color:#000;font-family:var(--sans);font-size:15px;font-weight:600;text-decoration:none;\">Make your own story</a>";app.appendChild(wrap);}
function renderStory(story){var app=document.getElementById("app");app.innerHTML="";var genreBgs={dramatic:"linear-gradient(135deg,#060810 0%,#060402 100%)",romantic:"linear-gradient(135deg,#120E06 0%,#060402 100%)",funny:"linear-gradient(135deg,#0C0A06 0%,#060402 100%)",action:"linear-gradient(135deg,#080A0C 0%,#060402 100%)",tragic:"linear-gradient(135deg,#060A10 0%,#060402 100%)",triumphant:"linear-gradient(135deg,#100E04 0%,#060402 100%)"};app.style.background=genreBgs[story.genre]||"#060402";var images=story.images||[];var wrap=document.createElement("div");wrap.style.cssText="position:absolute;inset:0;overflow:hidden;";app.appendChild(wrap);var imgWrap=document.createElement("div");imgWrap.style.cssText="position:absolute;inset:0;overflow:hidden;";wrap.appendChild(imgWrap);var bgImg=document.createElement("img");bgImg.src=images[0]||"";bgImg.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenBurns1 9s ease-in-out forwards;";bgImg.id="bg-img";imgWrap.appendChild(bgImg);var overlay1=document.createElement("div");overlay1.style.cssText="position:absolute;inset:0;background:rgba(0,0,0,0.45);";imgWrap.appendChild(overlay1);var gradTop=document.createElement("div");gradTop.style.cssText="position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent);z-index:2;pointer-events:none;";wrap.appendChild(gradTop);var gradBot=document.createElement("div");gradBot.style.cssText="position:absolute;bottom:0;left:0;right:0;height:280px;background:linear-gradient(to top,rgba(0,0,0,0.97),transparent);z-index:2;pointer-events:none;";wrap.appendChild(gradBot);var logo=document.createElement("div");logo.style.cssText="position:absolute;top:44px;left:16px;z-index:10;display:flex;align-items:center;gap:5px;opacity:0.82;cursor:pointer;";logo.onclick=function(){window.location.href="https://snowball-ten.vercel.app";};logo.innerHTML="<span style=\"font-family:var(--serif);font-size:16px;font-weight:600;color:var(--cream);\">snow</span><div class=\"ball\" style=\"width:13px;height:13px;box-shadow:"+ballShadow(13)+";\"></div><span style=\"font-family:var(--serif);font-size:16px;font-weight:600;color:var(--cream);\">ball</span>";wrap.appendChild(logo);var playBtn=document.createElement("button");playBtn.style.cssText="position:absolute;top:44px;right:20px;z-index:20;width:44px;height:44px;border-radius:50%;background:var(--gold);font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(229,180,68,0.55);";playBtn.textContent="▶";wrap.appendChild(playBtn);var hookOverlay=document.createElement("div");hookOverlay.style.cssText="position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 32px 220px;text-align:center;pointer-events:none;";hookOverlay.innerHTML="<div style=\"font-family:var(--sans);font-size:10px;font-weight:500;color:var(--gold);letter-spacing:0.24em;text-transform:uppercase;margin-bottom:18px;animation:fadeUp 0.8s 0.4s both;\">"+(story.location||"")+"</div><div style=\"font-family:var(--serif);font-size:32px;font-weight:400;color:var(--cream);line-height:1.25;animation:fadeUp 0.8s 0.7s both;\">"+(story.hook||"")+"</div>";wrap.appendChild(hookOverlay);var capOverlay=document.createElement("div");capOverlay.style.cssText="position:absolute;bottom:170px;left:0;right:0;z-index:4;padding:0 24px;text-align:center;pointer-events:none;display:none;";capOverlay.id="cap-overlay";var capWord=document.createElement("div");capWord.style.cssText="font-family:var(--sans);font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.9);letter-spacing:0.02em;line-height:1.2;";capOverlay.appendChild(capWord);wrap.appendChild(capOverlay);var audio=document.createElement("audio");audio.src=story.audioUrl||"";wrap.appendChild(audio);var curImg=0,playing=false,imgTimer=null;var ctaShown=false;function showImg(i){curImg=i;if(!images[i]||images[i]===(imgWrap._lastSrc||""))return;imgWrap._lastSrc=images[i];var newImg=document.createElement("img");newImg.src=images[i];newImg.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.8s ease;animation:"+KB[i%4]+" 9s ease-in-out forwards;";imgWrap.appendChild(newImg);setTimeout(function(){newImg.style.opacity="1";setTimeout(function(){var old=document.getElementById("bg-img");if(old&&old!==newImg)old.remove();newImg.id="bg-img";},900);},50);}
playBtn.onclick=function(){if(playing){audio.pause();playing=false;playBtn.textContent="▶";if(imgTimer){clearInterval(imgTimer);imgTimer=null;}if(typeof SnowballMusic!=="undefined")SnowballMusic.stop();}else{if(typeof SnowballMusic!=="undefined")SnowballMusic.unlock();audio.play().then(function(){playing=true;trackEvent('receiver_played',{genre:story.genre||null});if(typeof SnowballMusic!=="undefined"){try{SnowballMusic.play(story.genre||"dramatic");}catch(e){}}playBtn.textContent="⏸";setTimeout(function(){hookOverlay.style.transition="opacity 1.2s";hookOverlay.style.opacity="0";},3000);if(!imgTimer&&images.length>1){var per=Math.min(((audio.duration||20)/images.length)*1000,2500);imgTimer=setInterval(function(){curImg=(curImg+1)%images.length;showImg(curImg);},per);}var words=(story.narration||"").split(/\s+/).filter(Boolean);if(words.length){capOverlay.style.display="block";var wi=0;var wpt=Math.max(400,((audio.duration||20)/words.length)*1000);function showWord(){if(wi>=words.length||!playing)return;capWord.style.animation="none";void capWord.offsetWidth;capWord.textContent=words[wi];capWord.style.animation="captionPop 0.12s cubic-bezier(0.34,1.56,0.64,1) both";wi++;setTimeout(showWord,wpt);}showWord();}}).catch(function(e){});}};
wrap.addEventListener("click",function(e){if(!playing&&e.target===wrap){playBtn.onclick();}});audio.onended=function(){playing=false;playBtn.textContent="▶";if(imgTimer){clearInterval(imgTimer);imgTimer=null;}capOverlay.style.display="none";if(typeof SnowballMusic!=="undefined")SnowballMusic.stop();if(!ctaShown){ctaShown=true;var cta=document.createElement("div");cta.style.cssText="position:absolute;bottom:0;left:0;right:0;z-index:6;padding:40px 20px 56px;background:linear-gradient(to top,rgba(4,2,1,1) 0%,transparent 100%);display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadeUp 0.6s ease both;";var ctaQ=document.createElement("div");ctaQ.style.cssText="font-family:var(--serif);font-size:22px;font-style:italic;font-weight:300;color:var(--cream);text-align:center;line-height:1.3;";ctaQ.textContent="Your turn.";cta.appendChild(ctaQ);var replyBtn=document.createElement("a");replyBtn.href="https://snowball-ten.vercel.app";replyBtn.style.cssText="display:inline-block;padding:14px 32px;color:var(--gold);font-family:var(--sans);font-size:16px;font-weight:600;text-decoration:none;letter-spacing:0.02em;";replyBtn.textContent="Tell me yours \u2192";replyBtn.onclick=function(){trackEvent('remake_tapped',{genre:story.genre||null});};cta.appendChild(replyBtn);var thrown=story.createdAt?new Date(story.createdAt):null;var dateStr=thrown?(Date.now()-thrown.getTime()<86400000?"Thrown today":"Thrown "+thrown.toLocaleDateString("en-US",{month:"short",day:"numeric"})):"";if(dateStr){var dateEl=document.createElement("div");dateEl.style.cssText="font-family:var(--sans);font-size:11px;color:var(--muted);text-align:center;margin-top:6px;";dateEl.textContent=dateStr;cta.appendChild(dateEl);}wrap.appendChild(cta);}};};
async function init(){var id=getStoryId();if(!id){renderError();return;}renderLoading();try{var story=await loadStory(id);trackEvent('receiver_opened',{storyId:id,genre:story.genre||null});try{document.querySelector('meta[property="og:title"]').setAttribute('content',story.hook||'A Snowball Story');document.querySelector('meta[property="og:description"]').setAttribute('content',story.caption||'');document.querySelector('meta[property="og:image"]').setAttribute('content',(story.images&&story.images[0])||'');document.querySelector('meta[property="og:url"]').setAttribute('content',window.location.href);document.title=(story.hook||'Snowball')+' | Snowball';}catch(e){}renderStory(story);}catch(e){renderError();}}
init();
</script>
<script src="/music.js"></script>
<script src="/recorder.js"></script></body>
</html>
